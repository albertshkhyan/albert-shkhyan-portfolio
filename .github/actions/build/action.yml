# Reusable build: install → lint → build.
# Single source of truth for Node version (.nvmrc), lint, and build steps.

name: Build
description: Install dependencies, lint, and build the app

inputs:
  base-path:
    description: 'Base path for assets (e.g. /repo-name/ for GitHub Pages). Omit for root.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Lint
      run: npm run lint
      shell: bash

    - name: Build
      run: npm run build
      shell: bash
      env:
        VITE_BASE_PATH: ${{ inputs.base-path }}
